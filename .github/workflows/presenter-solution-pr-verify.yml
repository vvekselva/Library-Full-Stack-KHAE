name: Verify Presenter Solution PR

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presenter-solution-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'Presenter-Solutions-')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: library_full_stack
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d library_full_stack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run Presenter solution tests with PostgreSQL
        working-directory: backend/backend.lib.mgmt
        run: bash mvnw --batch-mode --no-transfer-progress test

  frontend-build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'Presenter-Solutions-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/frontend.lib.mgmt/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend/frontend.lib.mgmt
        run: npm ci
      - name: Build Vite frontend
        working-directory: frontend/frontend.lib.mgmt
        run: npm run build
